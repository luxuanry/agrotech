[project]
name = "nutri-rewriter"
version = "0.1.0"
description = "LLM agent that reformulates a recipe until its Nutri-Score is A or B"
readme = "README.md"
authors = [
    { name = "BEAN4222", email = "nakevin004@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nutri-rewriter = "nutri_rewriter:main"
nutri-rewriter-api = "nutri_rewriter.server:serve"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
